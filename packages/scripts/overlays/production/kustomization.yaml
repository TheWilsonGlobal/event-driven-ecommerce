apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - namespace.yaml
  - ../../base

patches:
  - path: patch-resources.yaml

images:
  - name: event-driven-ecommerce/api-gateway
    newTag: latest
  - name: event-driven-ecommerce/ms-user
    newTag: latest
  - name: event-driven-ecommerce/ms-product
    newTag: latest
  - name: event-driven-ecommerce/ms-order
    newTag: latest
  - name: event-driven-ecommerce/frontend
    newTag: latest