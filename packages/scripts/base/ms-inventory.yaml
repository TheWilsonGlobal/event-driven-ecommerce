apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-inventory
  labels:
    app: ms-inventory
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-inventory
  template:
    metadata:
      labels:
        app: ms-inventory
    spec:
      containers:
        - name: ms-inventory
          image: event-driven-ecommerce/ms-inventory:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5466
              name: http
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
          env:
            - name: INVENTORY_SERVICE_PORT
              value: "5466"
            - name: KAFKA_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5466
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5466
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms-inventory
  labels:
    app: ms-inventory
spec:
  type: ClusterIP
  ports:
    - port: 5466
      targetPort: 5466
      name: http
  selector:
    app: ms-inventory
