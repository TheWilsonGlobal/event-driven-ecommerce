# Backing services only: Redis (BullMQ + KV cache) and RustFS (S3 object storage).
#
# The application packages run on the host via pnpm, so this file deliberately
# excludes the five Node services, Postgres, MongoDB, Elasticsearch, Prometheus
# and Grafana that docker-compose.yml also defines.
#
#   docker compose -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.infra.yml ps
#   docker compose -f docker-compose.infra.yml down        # keeps data
#   docker compose -f docker-compose.infra.yml down -v     # wipes the Redis volume
#
# Container names and the network match docker-compose.yml, so the two files
# cannot both be up at once — that is intentional, not a limitation.

services:
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    # Match the k8s manifest (scripts/k8s/base/redis.yaml), which enables AOF.
    # Without this, Redis persists via RDB snapshots alone and a hard kill loses
    # up to 5 minutes of writes -- visible as BullMQ jobs vanishing on restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # "Up" means the process started, not that it answers PING. Without this,
      # a service that waits on Redis can connect before it is accepting commands.
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - ecommerce-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: ecommerce-rustfs
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfspassword
      - RUSTFS_DEFAULT_BUCKET=ecommerce-uploads
    ports:
      - "9000:9000"   # S3 API      -> RUSTFS_ENDPOINT in .env
      - "9001:9001"   # Web console -> RUSTFS_CONSOLE_ENDPOINT in .env
    volumes:
      # Bind mount, not a named volume: object data stays browsable in the repo
      # at data/rustfs/ (gitignored). This mirrors docker-compose.yml.
      - ./data/rustfs:/data
    restart: unless-stopped
    networks:
      - ecommerce-network

volumes:
  redis_data:

networks:
  ecommerce-network:
    driver: bridge
