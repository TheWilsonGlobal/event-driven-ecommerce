# Application services for the event-driven-ecommerce platform.
#
# Application data lives in ONE Supabase Postgres (a schema per service); there
# is no local database container. Other backing services (Redis, Elasticsearch,
# RustFS, Prometheus, Grafana) are NOT defined here -- they moved to the infra-hub
# repo, which owns their lifecycle. Redis and RustFS run by default there;
# the rest sit behind compose profiles.
#
# Start infrastructure first, or this file fails with "network not found":
#     cd ../infra-hub && docker compose up -d
#     docker compose up -d
#
# `version:` is obsolete in Compose v2 and ignored; kept off deliberately.

services:

  api-gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
    container_name: ecommerce-api-gateway
    environment:
      # API defense (change-05). Values come from the repo-root .env via interpolation.
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      AUTH_ENFORCE: ${AUTH_ENFORCE:-report}
      RATE_LIMIT_ENFORCE: ${RATE_LIMIT_ENFORCE:-report}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?set SERVICE_AUTH_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5461,http://localhost:5462}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NODE_ENV: development
      PORT: 5460
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: http://user-service:5463
      PRODUCT_SERVICE_URL: http://product-service:5464
      ORDER_SERVICE_URL: http://order-service:5465
    ports:
      - "5460:5460"
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - infra-network
    volumes:
      - ./packages/gateway/src:/app/src
      - /app/node_modules

  user-service:
    build:
      context: .
      dockerfile: packages/ms-user/Dockerfile
    container_name: ecommerce-user-service
    environment:
      # API defense (change-05). Values come from the repo-root .env via interpolation.
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      AUTH_ENFORCE: ${AUTH_ENFORCE:-report}
      RATE_LIMIT_ENFORCE: ${RATE_LIMIT_ENFORCE:-report}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?set SERVICE_AUTH_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5461,http://localhost:5462}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NODE_ENV: development
      PORT: 5463
      # Single Supabase Postgres, one schema per service (change-03-db-upgrade).
      # Values come from the repo-root .env via compose interpolation.
      DB_MODE: supabase
      RELATIONAL_DB_DRIVER: postgres
      DOCUMENT_DB_DRIVER: postgres
      USER_DATABASE_URL: ${USER_DATABASE_URL:-${SUPABASE_DB_URL:?set SUPABASE_DB_URL in .env}/postgres?schema=ms_user}
      USER_DIRECT_URL: ${USER_DIRECT_URL:-${SUPABASE_DB_URL:?set SUPABASE_DB_URL in .env}/postgres?schema=ms_user}
      DB_POOL_MAX: ${DB_POOL_MAX:-3}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:5463:5463"
    networks:
      - infra-network
    volumes:
      - ./packages/ms-user/src:/app/src
      - /app/node_modules

  product-service:
    build:
      context: .
      dockerfile: packages/ms-product/Dockerfile
    container_name: ecommerce-product-service
    environment:
      # API defense (change-05). Values come from the repo-root .env via interpolation.
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      AUTH_ENFORCE: ${AUTH_ENFORCE:-report}
      RATE_LIMIT_ENFORCE: ${RATE_LIMIT_ENFORCE:-report}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?set SERVICE_AUTH_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5461,http://localhost:5462}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NODE_ENV: development
      PORT: 5464
      # Single Supabase Postgres, one schema per service (change-03-db-upgrade).
      # Values come from the repo-root .env via compose interpolation.
      DB_MODE: supabase
      RELATIONAL_DB_DRIVER: postgres
      DOCUMENT_DB_DRIVER: postgres
      PRODUCT_DATABASE_URL: ${PRODUCT_DATABASE_URL:-${SUPABASE_DB_URL:?set SUPABASE_DB_URL in .env}/postgres?schema=ms_product}
      PRODUCT_DIRECT_URL: ${PRODUCT_DIRECT_URL:-${SUPABASE_DB_URL:?set SUPABASE_DB_URL in .env}/postgres?schema=ms_product}
      DB_POOL_MAX: ${DB_POOL_MAX:-3}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5464:5464"
    networks:
      - infra-network
    volumes:
      - ./packages/ms-product/src:/app/src
      - /app/node_modules

  order-service:
    build:
      context: .
      dockerfile: packages/ms-order/Dockerfile
    container_name: ecommerce-order-service
    environment:
      # API defense (change-05). Values come from the repo-root .env via interpolation.
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      AUTH_ENFORCE: ${AUTH_ENFORCE:-report}
      RATE_LIMIT_ENFORCE: ${RATE_LIMIT_ENFORCE:-report}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?set SERVICE_AUTH_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5461,http://localhost:5462}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NODE_ENV: development
      PORT: 5465
      # Single Supabase Postgres, one schema per service (change-03-db-upgrade).
      # Values come from the repo-root .env via compose interpolation.
      DB_MODE: supabase
      RELATIONAL_DB_DRIVER: postgres
      DOCUMENT_DB_DRIVER: postgres
      ORDER_DATABASE_URL: ${ORDER_DATABASE_URL:-${SUPABASE_DB_URL:?set SUPABASE_DB_URL in .env}/postgres?schema=ms_order}
      ORDER_DIRECT_URL: ${ORDER_DIRECT_URL:-${SUPABASE_DB_URL:?set SUPABASE_DB_URL in .env}/postgres?schema=ms_order}
      DB_POOL_MAX: ${DB_POOL_MAX:-3}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-500}
      OUTBOX_LEASE_MS: ${OUTBOX_LEASE_MS:-60000}
      OUTBOX_SEND_TIMEOUT_MS: ${OUTBOX_SEND_TIMEOUT_MS:-10000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # ms-order stages events in its outbox and relays them to Kafka; it must reach the broker.
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "127.0.0.1:5465:5465"
    networks:
      - infra-network
    volumes:
      - ./packages/ms-order/src:/app/src
      - /app/node_modules

  # ── Event-backbone consumers ────────────────────────────────────────────
  #
  # Both are OPTIONAL. They consume from Redpanda, which lives in infra-hub
  # behind `--profile kafka`, and they boot fine without it: KAFKA_ENABLED
  # defaults to false, in which case no Kafka client is constructed at all and
  # every HTTP route still serves. Bringing them up with the broker down costs
  # a stale view, not a failed container.
  #
  # ⚠️ KAFKA_BROKERS is redpanda:29092, NOT localhost:9100. 29092 is the
  # broker's INTERNAL listener, which is the only one reachable from another
  # container on infra-network. 9100 is the host-side mapping, for processes
  # running on the host under `pnpm run dev`. Using the host value here fails
  # with ECONNREFUSED that looks exactly like a broker that is simply down.
  inventory-service:
    build:
      context: .
      dockerfile: packages/ms-inventory/Dockerfile
    container_name: ecommerce-inventory-service
    environment:
      # API defense (change-05). Values come from the repo-root .env via interpolation.
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      AUTH_ENFORCE: ${AUTH_ENFORCE:-report}
      RATE_LIMIT_ENFORCE: ${RATE_LIMIT_ENFORCE:-report}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?set SERVICE_AUTH_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5461,http://localhost:5462}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NODE_ENV: development
      INVENTORY_SERVICE_PORT: 5466
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: redpanda:29092
      # Single Supabase Postgres, one schema per service (change-03-db-upgrade).
      # Values come from the repo-root .env via compose interpolation.
      DB_MODE: supabase
      RELATIONAL_DB_DRIVER: postgres
      DOCUMENT_DB_DRIVER: postgres
      INVENTORY_DATABASE_URL: ${INVENTORY_DATABASE_URL:-${SUPABASE_DB_URL:?set SUPABASE_DB_URL in .env}/postgres?schema=ms_inventory}
      INVENTORY_DIRECT_URL: ${INVENTORY_DIRECT_URL:-${SUPABASE_DB_URL:?set SUPABASE_DB_URL in .env}/postgres?schema=ms_inventory}
      DB_POOL_MAX: ${DB_POOL_MAX:-3}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-500}
      OUTBOX_LEASE_MS: ${OUTBOX_LEASE_MS:-60000}
      OUTBOX_SEND_TIMEOUT_MS: ${OUTBOX_SEND_TIMEOUT_MS:-10000}
    ports:
      - "127.0.0.1:5466:5466"
    networks:
      - infra-network
    volumes:
      - ./packages/ms-inventory/src:/app/src
      - /app/node_modules

  analytics-service:
    build:
      context: .
      dockerfile: packages/ms-analytics/Dockerfile
    container_name: ecommerce-analytics-service
    environment:
      # API defense (change-05). Values come from the repo-root .env via interpolation.
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      AUTH_ENFORCE: ${AUTH_ENFORCE:-report}
      RATE_LIMIT_ENFORCE: ${RATE_LIMIT_ENFORCE:-report}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?set SERVICE_AUTH_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5461,http://localhost:5462}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NODE_ENV: development
      ANALYTICS_SERVICE_PORT: 5467
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: redpanda:29092
      # Single Supabase Postgres, one schema per service (change-03-db-upgrade).
      # Values come from the repo-root .env via compose interpolation.
      DB_MODE: supabase
      RELATIONAL_DB_DRIVER: postgres
      DOCUMENT_DB_DRIVER: postgres
      ANALYTICS_DATABASE_URL: ${ANALYTICS_DATABASE_URL:-${SUPABASE_DB_URL:?set SUPABASE_DB_URL in .env}/postgres?schema=ms_analytics}
      ANALYTICS_DIRECT_URL: ${ANALYTICS_DIRECT_URL:-${SUPABASE_DB_URL:?set SUPABASE_DB_URL in .env}/postgres?schema=ms_analytics}
      DB_POOL_MAX: ${DB_POOL_MAX:-3}
    ports:
      - "127.0.0.1:5467:5467"
    networks:
      - infra-network
    volumes:
      - ./packages/ms-analytics/src:/app/src
      - /app/node_modules

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    container_name: ecommerce-client
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5460
      # Only the project URL and the PUBLISHABLE key reach the browser; never the secret key.
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?set SUPABASE_PUBLISHABLE_KEY in .env}
    ports:
      - "5462:5462"
    depends_on:
      - api-gateway
    networks:
      - infra-network
    volumes:
      - ./packages/client/src:/app/src
      - ./packages/client/public:/app/public
      - /app/node_modules

networks:
  # The backing services (postgres, redis, mongodb, elasticsearch, rustfs,
  # prometheus, grafana) moved to the infra-hub repo, which owns their
  # lifecycle. Joining its network as `external` is what keeps the service
  # hostnames below (DB_HOST: postgres, REDIS_HOST: redis, ...) resolving.
  #
  # infra-hub must be up first, or compose fails with "network not found":
  #     cd ../infra-hub && docker compose up -d
  #
  # The network is named <project>_infra-network, and infra-hub's project name
  # comes from its directory.
  infra-network:
    external: true
    name: infra-hub_infra-network