# Application services for the micro-services e-commerce platform.
#
# Backing services (PostgreSQL, MongoDB, Redis, Elasticsearch, RustFS,
# Prometheus, Grafana) are NOT defined here -- they moved to the infra-hub
# repo, which owns their lifecycle. Redis and RustFS run by default there;
# the rest sit behind compose profiles.
#
# Start infrastructure first, or this file fails with "network not found":
#     cd ../infra-hub && docker compose up -d
#     docker compose up -d
#
# `version:` is obsolete in Compose v2 and ignored; kept off deliberately.

services:

  api-gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
    container_name: ecommerce-api-gateway
    environment:
      NODE_ENV: development
      PORT: 5460
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_DATABASE: ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: http://user-service:5463
      PRODUCT_SERVICE_URL: http://product-service:5464
      ORDER_SERVICE_URL: http://order-service:5465
    ports:
      - "5460:5460"
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - infra-network
    volumes:
      - ./packages/gateway/src:/app/src
      - /app/node_modules

  user-service:
    build:
      context: .
      dockerfile: packages/ms-user/Dockerfile
    container_name: ecommerce-user-service
    environment:
      NODE_ENV: development
      PORT: 5463
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_DATABASE: ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://admin:password@mongodb:27017/ecommerce_sessions?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key
    ports:
      - "5463:5463"
    networks:
      - infra-network
    volumes:
      - ./packages/ms-user/src:/app/src
      - /app/node_modules

  product-service:
    build:
      context: .
      dockerfile: packages/ms-product/Dockerfile
    container_name: ecommerce-product-service
    environment:
      NODE_ENV: development
      PORT: 5464
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_DATABASE: ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    ports:
      - "5464:5464"
    networks:
      - infra-network
    volumes:
      - ./packages/ms-product/src:/app/src
      - /app/node_modules

  order-service:
    build:
      context: .
      dockerfile: packages/ms-order/Dockerfile
    container_name: ecommerce-order-service
    environment:
      NODE_ENV: development
      PORT: 5465
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_DATABASE: ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STRIPE_SECRET_KEY: sk_test_your-stripe-secret-key
    ports:
      - "5465:5465"
    networks:
      - infra-network
    volumes:
      - ./packages/ms-order/src:/app/src
      - /app/node_modules

  # ── Event-backbone consumers ────────────────────────────────────────────
  #
  # Both are OPTIONAL. They consume from Redpanda, which lives in infra-hub
  # behind `--profile kafka`, and they boot fine without it: KAFKA_ENABLED
  # defaults to false, in which case no Kafka client is constructed at all and
  # every HTTP route still serves. Bringing them up with the broker down costs
  # a stale view, not a failed container.
  #
  # ⚠️ KAFKA_BROKERS is redpanda:29092, NOT localhost:9100. 29092 is the
  # broker's INTERNAL listener, which is the only one reachable from another
  # container on infra-network. 9100 is the host-side mapping, for processes
  # running on the host under `pnpm run dev`. Using the host value here fails
  # with ECONNREFUSED that looks exactly like a broker that is simply down.
  inventory-service:
    build:
      context: .
      dockerfile: packages/ms-inventory/Dockerfile
    container_name: ecommerce-inventory-service
    environment:
      NODE_ENV: development
      INVENTORY_SERVICE_PORT: 5466
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: redpanda:29092
      NEDB_DATA_PATH: /app/data/nedb
    ports:
      - "5466:5466"
    networks:
      - infra-network
    volumes:
      - ./packages/ms-inventory/src:/app/src
      - inventory-data:/app/data
      - /app/node_modules

  analytics-service:
    build:
      context: .
      dockerfile: packages/ms-analytics/Dockerfile
    container_name: ecommerce-analytics-service
    environment:
      NODE_ENV: development
      ANALYTICS_SERVICE_PORT: 5467
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: redpanda:29092
      NEDB_DATA_PATH: /app/data/nedb
    ports:
      - "5467:5467"
    networks:
      - infra-network
    volumes:
      - ./packages/ms-analytics/src:/app/src
      - analytics-data:/app/data
      - /app/node_modules

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    container_name: ecommerce-client
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5460
    ports:
      - "5462:5462"
    depends_on:
      - api-gateway
    networks:
      - infra-network
    volumes:
      - ./packages/client/src:/app/src
      - ./packages/client/public:/app/public
      - /app/node_modules

volumes:
  # Aggregates and the processed-event ledgers. Named rather than bind-mounted
  # so they survive `up --build`: both services key idempotency on an eventId
  # ledger, and a wiped ledger turns a redelivery into a double-apply.
  inventory-data:
  analytics-data:

networks:
  # The backing services (postgres, redis, mongodb, elasticsearch, rustfs,
  # prometheus, grafana) moved to the infra-hub repo, which owns their
  # lifecycle. Joining its network as `external` is what keeps the service
  # hostnames below (DB_HOST: postgres, REDIS_HOST: redis, ...) resolving.
  #
  # infra-hub must be up first, or compose fails with "network not found":
  #     cd ../infra-hub && docker compose up -d
  #
  # The network is named <project>_infra-network, and infra-hub's project name
  # comes from its directory.
  infra-network:
    external: true
    name: infra-hub_infra-network