version: '3.8'

services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

  mongodb:
    image: mongo:7
    container_name: ecommerce-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: ecommerce_sessions
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecommerce-network

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network

  # Search Engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ecommerce-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-network

  # Distributed Object Storage (RustFS / S3 Compatible)
  rustfs:
    image: rustfs/rustfs:latest
    container_name: ecommerce-rustfs
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfspassword
      - RUSTFS_DEFAULT_BUCKET=ecommerce-uploads
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/rustfs:/data
    networks:
      - ecommerce-network

  # Application Services
  api-gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
    container_name: ecommerce-api-gateway
    environment:
      NODE_ENV: development
      PORT: 5460
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_DATABASE: ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: http://user-service:5463
      PRODUCT_SERVICE_URL: http://product-service:5464
      ORDER_SERVICE_URL: http://order-service:5465
    ports:
      - "5460:5460"
    depends_on:
      - postgres
      - redis
      - user-service
      - product-service
      - order-service
    networks:
      - ecommerce-network
    volumes:
      - ./packages/gateway/src:/app/src
      - /app/node_modules

  user-service:
    build:
      context: .
      dockerfile: packages/ms-user/Dockerfile
    container_name: ecommerce-user-service
    environment:
      NODE_ENV: development
      PORT: 5463
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_DATABASE: ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://admin:password@mongodb:27017/ecommerce_sessions?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key
    ports:
      - "5463:5463"
    depends_on:
      - postgres
      - redis
      - mongodb
    networks:
      - ecommerce-network
    volumes:
      - ./packages/ms-user/src:/app/src
      - /app/node_modules

  product-service:
    build:
      context: .
      dockerfile: packages/ms-product/Dockerfile
    container_name: ecommerce-product-service
    environment:
      NODE_ENV: development
      PORT: 5464
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_DATABASE: ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    ports:
      - "5464:5464"
    depends_on:
      - postgres
      - redis
      - elasticsearch
    networks:
      - ecommerce-network
    volumes:
      - ./packages/ms-product/src:/app/src
      - /app/node_modules

  order-service:
    build:
      context: .
      dockerfile: packages/ms-order/Dockerfile
    container_name: ecommerce-order-service
    environment:
      NODE_ENV: development
      PORT: 5465
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_DATABASE: ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STRIPE_SECRET_KEY: sk_test_your-stripe-secret-key
    ports:
      - "5465:5465"
    depends_on:
      - postgres
      - redis
    networks:
      - ecommerce-network
    volumes:
      - ./packages/ms-order/src:/app/src
      - /app/node_modules

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    container_name: ecommerce-client
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5460
    ports:
      - "5462:5462"
    depends_on:
      - api-gateway
    networks:
      - ecommerce-network
    volumes:
      - ./packages/client/src:/app/src
      - ./packages/client/public:/app/public
      - /app/node_modules

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - ecommerce-network

  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce-grafana
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ecommerce-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  elasticsearch_data:
  grafana_data:

networks:
  ecommerce-network:
    driver: bridge