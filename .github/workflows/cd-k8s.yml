name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["Build & Publish Containers"]
    branches: [main, master]
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: [self-hosted, Windows, X64]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'staging' || github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Kubeconfig
        shell: powershell
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          if (-not $env:KUBE_CONFIG) {
            Write-Host "KUBE_CONFIG_STAGING is not set; skipping cluster configuration."
            exit 0
          }
          $kubeDir = Join-Path $HOME ".kube"
          if (-not (Test-Path $kubeDir)) {
            New-Item -ItemType Directory -Path $kubeDir -Force | Out-Null
          }
          $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($env:KUBE_CONFIG))
          Set-Content -Path (Join-Path $kubeDir "config") -Value $decoded -Encoding utf8

      - name: Validate Manifests & Dry-Run
        shell: powershell
        run: |
          kubectl kustomize packages/scripts/overlays/staging -o staging-manifests.yaml
          Get-Content staging-manifests.yaml -Head 40
          Remove-Item staging-manifests.yaml -Force

      - name: Apply Manifests to Cluster
        shell: powershell
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          if (-not $env:KUBE_CONFIG) {
            Write-Host "KUBE_CONFIG_STAGING is not set; skipping deployment to cluster."
            exit 0
          }
          kubectl apply -k packages/scripts/overlays/staging
          kubectl rollout status deployment -l tier=backend -n staging --timeout=120s

  deploy-production:
    name: Deploy to Production
    runs-on: [self-hosted, Windows, X64]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'production' }}
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Kubeconfig
        shell: powershell
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PROD }}
        run: |
          if (-not $env:KUBE_CONFIG) {
            Write-Host "KUBE_CONFIG_PROD is not set; skipping cluster configuration."
            exit 0
          }
          $kubeDir = Join-Path $HOME ".kube"
          if (-not (Test-Path $kubeDir)) {
            New-Item -ItemType Directory -Path $kubeDir -Force | Out-Null
          }
          $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($env:KUBE_CONFIG))
          Set-Content -Path (Join-Path $kubeDir "config") -Value $decoded -Encoding utf8

      - name: Validate Manifests & Dry-Run
        shell: powershell
        run: |
          kubectl kustomize packages/scripts/overlays/production -o prod-manifests.yaml
          Get-Content prod-manifests.yaml -Head 40
          Remove-Item prod-manifests.yaml -Force

      - name: Apply Manifests to Cluster
        shell: powershell
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PROD }}
        run: |
          if (-not $env:KUBE_CONFIG) {
            Write-Host "KUBE_CONFIG_PROD is not set; skipping deployment to cluster."
            exit 0
          }
          kubectl apply -k packages/scripts/overlays/production
          kubectl rollout status deployment -l tier=backend -n production --timeout=180s
